# Universal 16S rRNA primer panel.
#
# Source: sponge_16s project (freshwater sponge, 9-primer pooled design) plus
# primer identification work on a Nematostella (cnidarian) sample. All nine
# pairs share the pooled-non-directional-library convention: a physical
# amplicon can be sequenced starting from either the forward or the reverse
# primer end, so sorting must be done in both directions (see
# bin/sort_amplicons.py).
#
# Each pair lists:
#   forward / reverse   : list of primer sequence variants (degenerate IUPAC
#                          bases allowed; list multiple entries for primers
#                          with multiple circulating variants rather than
#                          relying on IUPAC degeneracy alone)
#   forward_name /       : short primer names (27F, 806R, etc.) -- used by
#   reverse_name           raw_contamination_by_primer.py's output labels
#   region               : approximate E. coli 16S rRNA gene span, for reference
#   span [start, end]   : REQUIRED for aggregate_abundance.py's region-overlap
#                          clustering
#
# A primer's read window (span/region) is a property of the primer itself --
# fixed by its binding position -- not of which pair it happens to be used
# in. E.g. 1389R produces the same ~150bp window (partial V8) whether paired
# with 967F (V5V8), 1048F (V6V8), or V7F (V7V8). `primer_regions` below is
# the single canonical source for this; every span/region on a pair or
# virtual sub-amplicon entry should match its primer(s)' entry there.
#
# **Current recommendation across this 9-pair panel: V4 (515F/806R), with
# V5V8 (~967F/1389R) as a close second.** Worst-case yield (fraction of raw
# reads surviving the full pipeline as real bacterial signal, across two
# very different hosts -- a freshwater sponge with heavy algal-plastid
# contamination, a cnidarian with heavy host-mitochondrial contamination):
# V4 (61.4%) > V5V8 (52.9%) > V3V4 (32.4%) > V7V8/V6V8/V6V9/V1V3 (4-12%) >
# V4V6/V3V6 (<0.1%, unusable in any animal host -- 926R has a severe,
# host-independent off-target affinity, see below). This ranking, and the
# eight rounds of methodology it took to get a trustworthy version of it
# (each one catching a real, previously-invisible bug), is the subject of
# `examples/nematostella_pilot/README.md` -- read that for the full story,
# including why 926R specifically (not the amplicons that happen to
# include it) is the panel's single worst element, confirmed by raw
# (pre-filter) contamination measurement across two biologically unrelated
# hosts (`python/raw_contamination_by_primer.py`).
#
# The recurring lesson worth carrying into any new primer panel: any
# classifier or filter has a default/threshold for "didn't clearly match,"
# and if that default silently favors one outcome, a real signal (or a real
# artifact) can hide in it indefinitely -- audit what a script's default
# bucket actually contains before trusting a summary number, at every rank
# and every filtering step, not just once.

# Per-primer READ WINDOW -- not the primer binding site itself. `span` is
# the ~150bp of 16S gene sequence a single-end read starting at that primer
# actually covers, keyed by short primer name (one entry per primer, not
# per pair -- e.g. 1389R appears once even though it's reused by
# V5V8/V6V8/V7V8). The primer's own binding site is just one edge of that
# span, ~20bp wide: the START for a forward primer (its read extends
# rightward/downstream from there), the END for a reverse primer (its read
# extends leftward/upstream from there) -- e.g. 520R anneals around
# position ~534 and its read covers back to 384, spanning V3. `role` is
# which end of a pair a primer is normally used as; `region` is the
# approximate variable-region label for the span. V7F's span is null:
# V7V8 (its only pair) is short enough to true-overlap-merge rather than
# split, so its single-end read window was never independently computed.
primer_regions:
  27F:    {role: forward, span: [8, 158],     region: "full V1, partial V2"}
  341F:   {role: forward, span: [341, 491],   region: "partial V3"}
  515F:   {role: forward, span: [515, 665],   region: "partial V4"}
  967F:   {role: forward, span: [967, 1117],  region: "~V6"}
  1048F:  {role: forward, span: [1048, 1198], region: "~V7"}
  V7F:    {role: forward, span: null,         region: "V7 start (not split -- V7V8 true-merges)"}
  520R:   {role: reverse, span: [384, 534],   region: "full V3"}
  806R:   {role: reverse, span: [656, 806],   region: "partial V4"}
  926R:   {role: reverse, span: [776, 926],   region: "full V5"}
  1389R:  {role: reverse, span: [1239, 1389], region: "~V8"}
  1492R:  {role: reverse, span: [1342, 1492], region: "~V9"}

primer_pairs:
  V1V3:
    forward: [AGAGTTTGATCCTGGCTCAG, AGAGTTTGATCATGGCTCAG]
    reverse: [CGTCAGGCTTTCGCCCATTG, GGTCAGGCTTTCGCCCATTG, GATCAGGCTTTCGCCCATTG, CGTCAGGCTTGCGCCCATTG]
    forward_name: "27F"
    reverse_name: "520R"
    region: "8-534 (V1-V3)"
    span: [8, 534]  # [start, end] for programmatic overlap detection
    notes: "27F / 520R. Final yield (post-prefilter): 4.6% sponge / 22.4% Nematostella (worst-case 4.6%), 99/10 bacterial ASVs. Looked best under the ONE-read vsearch/OTU method; low yield once purity is normalized by prefiltering -- see file header. Not currently recommended."

  V3V4:
    forward: [CCTACGGGNGGCWGCAG, CCTACGGGAGGCAGCA]
    reverse: [CTACCAGGGTATCTAATCCT]
    forward_name: "341F"
    reverse_name: "806R"
    region: "341-806 (V3-V4)"
    span: [341, 806]  # [start, end] for programmatic overlap detection
    notes: "341F / 806R. Final yield (post-prefilter): 54.7% sponge / 32.4% Nematostella (worst-case 32.4%), 431/26 bacterial ASVs. Best pick under the pre-prefilter ASV+SILVA round; now clearly third -- its Nematostella yield trails V4/V5V8 once purity is normalized across all 9 pairs by prefiltering."

  V3V6:
    forward: [CCTACGGGNGGCWGCAG, CCTACGGGAGGCAGCA]
    reverse: [CCGTCAATTCCTTTGAGTTT, CCGTCAATTCATTTGAGTTT]
    forward_name: "341F"
    reverse_name: "926R"
    region: "341-926 (V3-V6)"
    span: [341, 926]  # [start, end] for programmatic overlap detection
    notes: "341F / 926R. Final yield (post-prefilter): 5.0% sponge / 0.08% Nematostella (worst-case 0.08%), 175/14 bacterial ASVs. AVOID IN BOTH HOSTS -- raw (pre-prefilter) contamination for 926R paired with 341F is 85.2% sponge / 99.7% Nematostella (python/raw_contamination_by_primer.py); 926R acts as a contamination 'hub' that drives any successfully-paired forward primer to 80-99.8% raw contamination in both hosts tested. Not a Nematostella-specific or classifier-artifact problem -- drop 926R from future panels entirely."

  V4:
    forward: [GTGYCAGCMGCCGCGGTA, GCCAGCAGCCGCGGTAA]
    reverse: [CTACCAGGGTATCTAATCCT]
    forward_name: "515F"
    reverse_name: "806R"
    region: "515-806 (V4)"
    span: [515, 806]  # [start, end] for programmatic overlap detection
    notes: "515F / 806R. Final yield (post-prefilter): 61.4% sponge / 61.9% Nematostella (worst-case 61.4%), 789/46 bacterial ASVs -- CURRENT RECOMMENDED DEFAULT, best cross-host yield across all 9 pairs, consistent in both hosts. 806R has predicted affinity for Stichodactyla-type (anemone) mtDNA, so don't assume this generalizes to every cnidarian host."

  V4V6:
    forward: [GTGYCAGCMGCCGCGGTA, GCCAGCAGCCGCGGTAA]
    reverse: [CCGTCAATTCCTTTGAGTTT, CCGTCAATTCATTTGAGTTT]
    forward_name: "515F"
    reverse_name: "926R"
    region: "515-926 (V4-V6)"
    span: [515, 926]  # [start, end] for programmatic overlap detection
    notes: "515F / 926R. Final yield (post-prefilter): 8.5% sponge / 0.09% Nematostella (worst-case 0.09%), 327/22 bacterial ASVs -- WORST amplicon of the 9 in both hosts, and now confirmed why: raw contamination for 926R paired with 515F is 84.6% sponge / 99.8% Nematostella, essentially identical to 926R's rate paired with 341F (V3V6). The problem is 926R itself, not 515F specifically -- 515F alone (paired with 806R, see V4 entry) only runs 17-27% raw contamination, comparable to other moderate primers in this panel."

  V5V8:
    forward: [MWACGCGMRGAACCTTACCW]
    reverse: [GACGGGCGGTGTGTACAAGG]
    forward_name: "967F"
    reverse_name: "1389R"
    region: "967-1389 (~V5-V8)"
    span: [967, 1389]  # [start, end] for programmatic overlap detection
    notes: "~967F / 1389R. Final yield (post-prefilter): 52.9% sponge / 74.9% Nematostella (worst-case 52.9%), 901/36 bacterial ASVs -- close second choice, highest single-host yield of any pair (Nematostella)."

  V6V8:
    forward: [ATGGCTGTCGTCAGCTCGTG]
    reverse: [GACGGGCGGTGTGTACAAGG]
    forward_name: "1048F"
    reverse_name: "1389R"
    region: "1048-1389 (V6-V8)"
    span: [1048, 1389]  # [start, end] for programmatic overlap detection
    notes: "1048F / 1389R. Final yield (post-prefilter): 7.5% sponge / 6.4% Nematostella (worst-case 6.4%), 632/19 bacterial ASVs."

  V6V9:
    forward: [ATGGCTGTCGTCAGCTCGTG]
    reverse: [TACCTTGTTACGACTTCGCT, TACCTTGTTACGACTTCATT]
    forward_name: "1048F"
    reverse_name: "1492R"
    region: "1048-1492 (V6-V9)"
    span: [1048, 1492]  # [start, end] for programmatic overlap detection
    notes: "1048F / 1492R. Final yield (post-prefilter): 5.0% sponge / 4.2% Nematostella (worst-case 4.2%), 74/6 bacterial ASVs."

  # ── Virtual sub-amplicons: R1-only / R2-only independent taxonomy for
  #    V5V8, V6V8, V6V9 (run_dada2.R --split-amplicons). These aren't new
  #    primer pairs -- each shares its parent amplicon's actual primers --
  #    they exist so aggregate_abundance.py can region-cluster each read's
  #    own variable-region coverage independently instead of only ever
  #    seeing the (for these 3 amplicons, never-overlapping) whole-amplicon
  #    span. Spans computed from primer position + ~150bp read length; see
  #    examples/nematostella_pilot/README.md's chimera-detection section for
  #    the confirmed per-read variable-region coverage this is based on.
  V5V8_fwdhalf:
    forward: [MWACGCGMRGAACCTTACCW]
    reverse: []
    region: "967-1117 (V5V8, R1/967F only -- ~V6)"
    span: [967, 1117]
    notes: "Independent taxonomy for V5V8's forward-primer-proximal read (R1). See V5V8 for primer sequences; this entry exists only for region-overlap clustering."

  V5V8_revhalf:
    forward: []
    reverse: [GACGGGCGGTGTGTACAAGG]
    region: "1239-1389 (V5V8, R2/1389R only -- ~V8)"
    span: [1239, 1389]
    notes: "Independent taxonomy for V5V8's reverse-primer-proximal read (R2). See V5V8 for primer sequences; this entry exists only for region-overlap clustering."

  V6V8_fwdhalf:
    forward: [ATGGCTGTCGTCAGCTCGTG]
    reverse: []
    region: "1048-1198 (V6V8, R1/1048F only -- ~V7)"
    span: [1048, 1198]
    notes: "Independent taxonomy for V6V8's forward-primer-proximal read (R1). See V6V8 for primer sequences; this entry exists only for region-overlap clustering."

  V6V8_revhalf:
    forward: []
    reverse: [GACGGGCGGTGTGTACAAGG]
    region: "1239-1389 (V6V8, R2/1389R only -- ~V8)"
    span: [1239, 1389]
    notes: "Independent taxonomy for V6V8's reverse-primer-proximal read (R2). See V6V8 for primer sequences; this entry exists only for region-overlap clustering."

  V6V9_fwdhalf:
    forward: [ATGGCTGTCGTCAGCTCGTG]
    reverse: []
    region: "1048-1198 (V6V9, R1/1048F only -- ~V7)"
    span: [1048, 1198]
    notes: "Independent taxonomy for V6V9's forward-primer-proximal read (R1). See V6V9 for primer sequences; this entry exists only for region-overlap clustering."

  V6V9_revhalf:
    forward: []
    reverse: [TACCTTGTTACGACTTCGCT, TACCTTGTTACGACTTCATT]
    region: "1342-1492 (V6V9, R2/1492R only -- ~V9)"
    span: [1342, 1492]
    notes: "Independent taxonomy for V6V9's reverse-primer-proximal read (R2). See V6V9 for primer sequences; this entry exists only for region-overlap clustering."

  # V1V3/V3V4/V3V6/V4V6 split halves, added in round 6/8 to cover the
  # remaining amplicons whose gap clips a region's edge (see run_dada2.R's
  # --split-amplicons docstring) -- needed for region-overlap clustering
  # once these are also processed as independent single-end reads.
  V1V3_fwdhalf:
    forward: [AGAGTTTGATCCTGGCTCAG, AGAGTTTGATCATGGCTCAG]
    reverse: []
    region: "8-158 (V1V3, R1/27F only -- full V1, partial V2)"
    span: [8, 158]
    notes: "Independent taxonomy for V1V3's forward-primer-proximal read (R1, 27F). See V1V3 for primer sequences."

  V1V3_revhalf:
    forward: []
    reverse: [CGTCAGGCTTTCGCCCATTG, GGTCAGGCTTTCGCCCATTG, GATCAGGCTTTCGCCCATTG, CGTCAGGCTTGCGCCCATTG]
    region: "384-534 (V1V3, R2/520R only -- full V3)"
    span: [384, 534]
    notes: "Independent taxonomy for V1V3's reverse-primer-proximal read (R2, 520R). See V1V3 for primer sequences."

  V3V4_fwdhalf:
    forward: [CCTACGGGNGGCWGCAG, CCTACGGGAGGCAGCA]
    reverse: []
    region: "341-491 (V3V4, R1/341F only -- partial V3)"
    span: [341, 491]
    notes: "Independent taxonomy for V3V4's forward-primer-proximal read (R1, 341F). See V3V4 for primer sequences."

  V3V4_revhalf:
    forward: []
    reverse: [CTACCAGGGTATCTAATCCT]
    region: "656-806 (V3V4, R2/806R only -- partial V4)"
    span: [656, 806]
    notes: "Independent taxonomy for V3V4's reverse-primer-proximal read (R2, 806R). See V3V4 for primer sequences."

  V3V6_fwdhalf:
    forward: [CCTACGGGNGGCWGCAG, CCTACGGGAGGCAGCA]
    reverse: []
    region: "341-491 (V3V6, R1/341F only -- partial V3)"
    span: [341, 491]
    notes: "Independent taxonomy for V3V6's forward-primer-proximal read (R1, 341F). See V3V6 for primer sequences."

  V3V6_revhalf:
    forward: []
    reverse: [CCGTCAATTCCTTTGAGTTT, CCGTCAATTCATTTGAGTTT]
    region: "776-926 (V3V6, R2/926R only -- full V5)"
    span: [776, 926]
    notes: "Independent taxonomy for V3V6's reverse-primer-proximal read (R2, 926R). See V3V6 for primer sequences."

  V4V6_fwdhalf:
    forward: [GTGYCAGCMGCCGCGGTA, GCCAGCAGCCGCGGTAA]
    reverse: []
    region: "515-665 (V4V6, R1/515F only -- partial V4)"
    span: [515, 665]
    notes: "Independent taxonomy for V4V6's forward-primer-proximal read (R1, 515F). See V4V6 for primer sequences."

  V4V6_revhalf:
    forward: []
    reverse: [CCGTCAATTCCTTTGAGTTT, CCGTCAATTCATTTGAGTTT]
    region: "776-926 (V4V6, R2/926R only -- full V5)"
    span: [776, 926]
    notes: "Independent taxonomy for V4V6's reverse-primer-proximal read (R2, 926R). See V4V6 for primer sequences."

  V7V8:
    forward: [GTAACGAGCGCAACCCTTGT, GCAACGAGCGCAACCCTTGT]
    reverse: [GACGGGCGGTGTGTACAAGG]
    forward_name: "V7F"
    reverse_name: "1389R"
    region: "1117-1389 (V7-V8)"
    span: [1117, 1389]  # [start, end] for programmatic overlap detection
    notes: "V7F / 1389R. Final yield (post-prefilter): 12.4% sponge / 5.4% Nematostella (worst-case 5.4%), 441/16 bacterial ASVs."
